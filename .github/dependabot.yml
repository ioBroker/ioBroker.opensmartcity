# Dependabot will run on day 19 of each month at 01:13 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '13 1 19 * *'
    open-pull-requests-limit: 15

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '13 1 19 * *'
    open-pull-requests-limit: 15
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'npm'
    directories:
      - '/src-admin'
      - '/src-widgets'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '13 1 19 * *'
    open-pull-requests-limit: 20
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
