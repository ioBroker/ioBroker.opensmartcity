<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
    <!--
      Loads socket.io.js of the admin. On the dev server (port 3000) from the admin on port 8081.
      tasks.ts (patchHtmlFile) replaces this block in the build by a static <script> tag,
      so it must not contain a "<" character.
    -->
    <script>
      var script = document.createElement('script');
      window.registerSocketOnLoad = function (cb) {
        window.socketLoadedHandler = cb;
      };
      script.onload = function () { typeof window.socketLoadedHandler === 'function' && window.socketLoadedHandler(); };
      setTimeout(() => {
        script.src = window.location.port === '3000' ? window.location.protocol + '//' + window.location.hostname + ':8081/lib/js/socket.io.js' : '../../lib/js/socket.io.js';
      }, 1000);

      document.head.appendChild(script);
    </script>
    <title>OpenSmartCity Settings</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
